<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <pattern id="cardVersoHalftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#e30613" opacity="0.08" />
    </pattern>
    <filter id="cShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#0a0a0a" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .font-brand { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; }
    .font-poster { font-family: 'Impact', 'Archivo Black', 'Arial Black', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Kraft Background -->
  <rect width="500" height="320" rx="8" fill="#F3E6D2" stroke="#E5E7EB" stroke-width="1" />
  <rect width="500" height="320" rx="8" fill="url(#cardVersoHalftone)" />

  <!-- Top Strip -->
  <rect x="0" y="0" width="500" height="36" fill="#0A0A0A" />
  <text x="20" y="24" class="font-poster" font-size="16" fill="#FFFFFF">FICHE DE CORRECTION &amp; RENDEZ-VOUS</text>
  <text x="480" y="23" class="font-brand" font-size="11" fill="#E30613" text-anchor="end">LUNEO DALOA</text>

  <!-- Patient Name Field -->
  <g transform="translate(20, 52)">
    <text x="0" y="14" class="font-brand" font-size="11" font-weight="900" fill="#0A0A0A">PATIENT(E) :</text>
    <line x1="80" y1="14" x2="330" y2="14" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- Prescription Grid Table -->
  <g transform="translate(20, 80)">
    <!-- Table Header -->
    <rect x="0" y="0" width="330" height="24" fill="#E30613" rx="4" />
    <text x="35" y="16" class="font-brand" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">ŒIL</text>
    <text x="105" y="16" class="font-brand" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">SPHÈRE</text>
    <text x="175" y="16" class="font-brand" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">CYLINDRE</text>
    <text x="240" y="16" class="font-brand" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">AXE</text>
    <text x="295" y="16" class="font-brand" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">EP</text>

    <!-- Row 1: OD (Oeil Droit) -->
    <rect x="0" y="28" width="330" height="34" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" rx="3" />
    <text x="35" y="50" class="font-poster" font-size="15" fill="#E30613" text-anchor="middle">OD</text>
    <line x1="70" y1="28" x2="70" y2="62" stroke="#E5E7EB" />
    <line x1="140" y1="28" x2="140" y2="62" stroke="#E5E7EB" />
    <line x1="210" y1="28" x2="210" y2="62" stroke="#E5E7EB" />
    <line x1="270" y1="28" x2="270" y2="62" stroke="#E5E7EB" />

    <!-- Row 2: OG (Oeil Gauche) -->
    <rect x="0" y="66" width="330" height="34" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" rx="3" />
    <text x="35" y="88" class="font-poster" font-size="15" fill="#E30613" text-anchor="middle">OG</text>
    <line x1="70" y1="66" x2="70" y2="100" stroke="#E5E7EB" />
    <line x1="140" y1="66" x2="140" y2="100" stroke="#E5E7EB" />
    <line x1="210" y1="66" x2="210" y2="100" stroke="#E5E7EB" />
    <line x1="270" y1="66" x2="270" y2="100" stroke="#E5E7EB" />
  </g>

  <!-- Right Side: QR Code to WhatsApp / RDV -->
  <g transform="translate(370, 75)">
    <rect x="0" y="0" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" filter="url(#cShadow2)" />
    <!-- QR Code Pattern Elements -->
    <g fill="#0A0A0A">
      <!-- Top Left Marker -->
      <rect x="12" y="12" width="26" height="26" /><rect x="16" y="16" width="18" height="18" fill="#FFFFFF" /><rect x="20" y="20" width="10" height="10" />
      <!-- Top Right Marker -->
      <rect x="72" y="12" width="26" height="26" /><rect x="76" y="16" width="18" height="18" fill="#FFFFFF" /><rect x="80" y="20" width="10" height="10" />
      <!-- Bottom Left Marker -->
      <rect x="12" y="72" width="26" height="26" /><rect x="16" y="76" width="18" height="18" fill="#FFFFFF" /><rect x="20" y="80" width="10" height="10" />
      <!-- Mini Matrix pixels -->
      <rect x="44" y="16" width="8" height="8" /><rect x="56" y="22" width="8" height="8" />
      <rect x="44" y="44" width="22" height="22" /><rect x="50" y="50" width="10" height="10" fill="#FFFFFF" />
      <rect x="74" y="48" width="8" height="8" /><rect x="86" y="60" width="8" height="8" />
      <rect x="44" y="74" width="8" height="16" /><rect x="74" y="78" width="14" height="8" />
    </g>
    <text x="55" y="130" class="font-brand" font-size="9" font-weight="900" fill="#0A0A0A" text-anchor="middle">SCANNER POUR RDV</text>
  </g>

  <!-- Appointment Date Box -->
  <g transform="translate(20, 205)">
    <rect x="0" y="0" width="330" height="52" rx="6" fill="#FFFFFF" stroke="#E5E7EB" />
    <text x="14" y="22" class="font-brand" font-size="10" font-weight="900" fill="#0A0A0A">DATE DE DÉLIVRANCE :</text>
    <line x1="140" y1="22" x2="310" y2="22" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="14" y="42" class="font-brand" font-size="10" font-weight="900" fill="#E30613">PROCHAIN CONTRÔLE :</text>
    <line x1="140" y1="42" x2="310" y2="42" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Bottom Notice -->
  <g transform="translate(20, 280)">
    <text x="0" y="16" class="font-body" font-size="9" font-style="italic" fill="#6B7280">
      * Nos verres optiques nécessitent une prescription médicale. Conservez précieusement cette carte.
    </text>
    <text x="460" y="16" class="font-brand" font-size="9" font-weight="900" fill="#E30613" text-anchor="end">
      Ajustement &amp; Nettoyage Gratuits à vie
    </text>
  </g>
</svg>

